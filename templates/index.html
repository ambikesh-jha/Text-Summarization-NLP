<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarization</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <h1>Automatic Text Summarization</h1>
        <form method="POST">
            <textarea name="input_text" placeholder="Enter text to summarize" rows="10" cols="50"></textarea><br>
            <label for="num_sentences">Number of Sentences:</label>
            <input type="number" name="num_sentences" value="3" min="1"><br>
            <button type="submit">Summarize</button>
        </form>
        {% if summary %}
        <h2>Summary:</h2>
        <p>{{ summary }}</p>
        {% endif %}
    </div>
</body>
</html>
